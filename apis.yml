name: Pelago
description: >-
  Pelago is a virtual-first digital clinic for substance use disorder,
  delivering personalized treatment for tobacco, alcohol, opioid, cannabis, and
  stimulant use. The platform combines digital cognitive behavioral tools, live
  clinical counseling, and medication-assisted treatment (PelagoRX) with
  same-day nationwide access. Pelago sells primarily to employers and health
  plans as a covered behavioral-health benefit, and also serves adolescents and
  members with co-occurring mental-health and chronic conditions. Formerly known
  as Quit Genius, the company is backed by Atomico and EQT Ventures. It publishes
  a public marketing and member-enrollment web presence but exposes no public
  developer API surface; this profile captures its identity, web properties, and
  published security/compliance posture.
